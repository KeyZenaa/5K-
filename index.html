<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inset</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F3F4EF;
    --paper-raised: #FBFBF8;
    --ink: #161A17;
    --muted: #5F6862;
    --line: #D6DAD1;
    --hover: #E4E7DE;
    --accent: #1F6F5C;
    --accent-ink: #FFFFFF;
    --serif: "Newsreader", Georgia, "Times New Roman", serif;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #121512;
      --paper-raised: #181C19;
      --ink: #E6EAE3;
      --muted: #97A19A;
      --line: #2C332E;
      --hover: #1F251F;
      --accent: #6CC3A8;
      --accent-ink: #0C1410;
    }
  }
  :root[data-theme="dark"] {
    --paper: #121512;
    --paper-raised: #181C19;
    --ink: #E6EAE3;
    --muted: #97A19A;
    --line: #2C332E;
    --hover: #1F251F;
    --accent: #6CC3A8;
    --accent-ink: #0C1410;
  }

  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    background: var(--paper);
    color: var(--ink);
    font: 16px/1.5 var(--sans);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  header {
    padding: calc(env(safe-area-inset-top, 0px) + 10px) 12px 10px;
    background: var(--paper-raised);
    border-bottom: 1px solid var(--line);
  }
  .bar { display: flex; align-items: center; gap: 6px; }
  .address { flex: 1; min-width: 0; display: flex; gap: 8px; margin: 0; }

  .icon-btn {
    flex: none;
    width: 38px;
    height: 38px;
    display: grid;
    place-items: center;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--ink);
    cursor: pointer;
    text-decoration: none;
  }
  .icon-btn svg {
    width: 18px;
    height: 18px;
    fill: none;
    stroke: currentColor;
    stroke-width: 2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .icon-btn:hover:not(:disabled) { background: var(--hover); }
  .icon-btn:disabled { opacity: .35; cursor: default; }

  input {
    flex: 1;
    min-width: 0;
    height: 38px;
    padding: 0 12px;
    font: 16px var(--sans);
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 6px;
  }
  input::placeholder { color: var(--muted); }

  .go {
    height: 38px;
    padding: 0 16px;
    border: 0;
    border-radius: 6px;
    background: var(--accent);
    color: var(--accent-ink);
    font: 600 15px var(--sans);
    cursor: pointer;
  }
  .go:hover { opacity: .9; }

  .status {
    margin: 8px 0 0;
    padding-left: 10px;
    border-left: 2px solid var(--accent);
    font-size: 14px;
    color: var(--muted);
  }

  .loader { position: relative; height: 2px; overflow: hidden; }
  .loader::after {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 40%;
    height: 100%;
    background: var(--accent);
    opacity: 0;
    transform: translateX(-100%);
  }
  .loader.on::after { opacity: 1; animation: sweep 1.2s ease-in-out infinite; }
  @keyframes sweep { to { transform: translateX(250%); } }

  main { flex: 1; min-height: 0; display: flex; }
  #frame {
    flex: 1;
    width: 100%;
    border: 0;
    background: var(--paper-raised);
  }

  .empty {
    margin: auto;
    padding: 32px 24px;
    max-width: 30rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 28px;
    text-align: center;
  }
  .empty h1 {
    margin: 0;
    font: 500 clamp(2rem, 6vw, 3rem)/1.1 var(--serif);
    letter-spacing: -.01em;
    text-wrap: balance;
  }
  .empty p {
    margin: 0;
    max-width: 36ch;
    color: var(--muted);
    text-wrap: pretty;
  }

  /* A window showing a smaller window: the idea of the app, drawn once. */
  .sketch {
    position: relative;
    width: min(300px, 78vw);
    aspect-ratio: 4 / 3;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--paper-raised);
  }
  .sketch::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 22px;
    border-bottom: 1px solid var(--line);
  }
  .sketch-inner {
    position: absolute;
    top: 34px;
    right: 12%;
    bottom: 14%;
    left: 22%;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    border: 1.5px solid var(--accent);
    border-radius: 6px;
    background: var(--paper);
    animation: rise .7s cubic-bezier(.2, .7, .2, 1) .1s both;
  }
  .sketch-inner i {
    display: block;
    height: 6px;
    width: 70%;
    border-radius: 3px;
    background: var(--line);
  }
  .sketch-inner i:nth-child(2) { width: 90%; }
  .sketch-inner i:nth-child(3) { width: 50%; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px) scale(.97); }
  }

  @media (prefers-reduced-motion: reduce) {
    .sketch-inner { animation: none; }
    .loader.on::after { animation: none; transform: none; width: 100%; opacity: .45; }
  }
</style>
</head>
<body>

<header>
  <div class="bar">
    <button class="icon-btn" id="back" type="button" aria-label="Back" disabled>
      <svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button class="icon-btn" id="reload" type="button" aria-label="Reload" disabled>
      <svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg>
    </button>
    <form class="address" id="form" autocomplete="off">
      <input id="address" type="text" inputmode="url" enterkeyhint="go"
             placeholder="Type an address" aria-label="Address"
             autocapitalize="off" autocorrect="off" spellcheck="false">
      <button class="go" type="submit">Open</button>
    </form>
    <a class="icon-btn" id="external" href="#" target="_blank" rel="noopener noreferrer"
       aria-label="Open in a new tab" hidden>
      <svg viewBox="0 0 24 24"><path d="M14 4h6v6"/><path d="M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>
    </a>
  </div>
  <p class="status" id="status" role="status" hidden></p>
</header>

<div class="loader" id="loader" aria-hidden="true"></div>

<main>
  <section class="empty" id="empty">
    <div class="sketch" aria-hidden="true">
      <div class="sketch-inner"><i></i><i></i><i></i></div>
    </div>
    <h1>Any website, inside this page.</h1>
    <p>Type an address above. A few sites refuse to be shown inside other pages. If one stays blank, open it in a new tab with the button at the top right.</p>
  </section>
  <iframe id="frame" title="Website" hidden allow="fullscreen; clipboard-write"></iframe>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const form = $('form');
  const input = $('address');
  const frame = $('frame');
  const empty = $('empty');
  const back = $('back');
  const reload = $('reload');
  const external = $('external');
  const loader = $('loader');
  const status = $('status');

  const past = [];
  let current = '';
  let timer = null;

  function normalize(raw) {
    const text = raw.trim();
    if (!text) return null;
    const isLocal = /^localhost(:|\/|$)/i.test(text);
    const hasScheme = /^[a-z][a-z\d+.-]*:\/\//i.test(text);
    const withScheme = hasScheme ? text : (isLocal ? 'http://' : 'https://') + text;
    let url;
    try {
      url = new URL(withScheme);
    } catch {
      return null;
    }
    if (url.protocol !== 'http:' && url.protocol !== 'https:') return null;
    if (!url.hostname.includes('.') && url.hostname !== 'localhost') return null;
    return url.href;
  }

  function setStatus(message) {
    status.textContent = message;
    status.hidden = !message;
  }

  function show(href, remember = true) {
    if (remember && current && current !== href) past.push(current);
    current = href;
    setStatus('');
    input.value = href;
    empty.hidden = true;
    frame.hidden = false;
    external.href = href;
    external.hidden = false;
    reload.disabled = false;
    back.disabled = past.length === 0;
    loader.classList.add('on');
    clearTimeout(timer);
    timer = setTimeout(giveUp, 15000);
    frame.src = href;
  }

  // Some sites never finish loading inside another page. Stop after a while and say so.
  function giveUp() {
    loader.classList.remove('on');
    frame.src = 'about:blank';
    setStatus('This site didn’t finish loading. Many sites don’t allow being shown inside other pages. Use the button at the top right to open it in Safari.');
  }

  frame.addEventListener('load', () => {
    clearTimeout(timer);
    loader.classList.remove('on');
  });

  // If the page isn't allowed to load other sites, say so instead of staying blank.
  document.addEventListener('securitypolicyviolation', (event) => {
    const directive = event.effectiveDirective || event.violatedDirective || '';
    if (/^(frame-src|child-src|default-src)/.test(directive)) {
      loader.classList.remove('on');
      setStatus('This view can’t load other websites. Open inset.html on your computer instead.');
    }
  });

  form.addEventListener('submit', (event) => {
    event.preventDefault();
    const href = normalize(input.value);
    if (!href) {
      setStatus('That isn’t a web address. Try something like example.com.');
      input.select();
      return;
    }
    show(href);
  });

  back.addEventListener('click', () => {
    const previous = past.pop();
    if (previous) show(previous, false);
  });

  reload.addEventListener('click', () => {
    if (current) show(current, false);
  });
</script>
</body>
</html>
